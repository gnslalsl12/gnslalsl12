        <g><rect width="62" height="28" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="31" y="19" text-anchor="middle">React</text></g>
        <g transform="translate(70,0)"><rect width="84" height="28" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="42" y="19" text-anchor="middle">Three.js</text></g>
        <g transform="translate(162,0)"><rect width="120" height="28" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="60" y="19" text-anchor="middle">Spring Boot</text></g>
        <g transform="translate(290,0)"><rect width="52" height="28" rx="14" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.4"/><text x="26" y="19" text-anchor="middle" fill="#bae6fd">AI</text></g>
      </g>
    </g>

    <!-- ======================= CARD 3 : 이음 ======================= -->
    <g transform="translate(20,264)">
      <circle cx="500" cy="180" r="120" fill="url(#g3)" filter="url(#b2)"/>
      <rect width="568" height="220" rx="22" fill="url(#cardbg)" stroke="#fff" stroke-opacity="0.10"/>
      <rect x="24" y="0.5" width="520" height="1" fill="url(#sheen2)"/>
      <g transform="translate(424,28)">
        <rect width="116" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.4"/>
        <text x="58" y="20" fill="#6ee7b7" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">BIG DATA</text>
      </g>
      <text x="32" y="58" font-size="14" font-weight="700" letter-spacing="2" fill="#7c7c92">03 · 팀 프로젝트 · SSAFY</text>
      <text x="32" y="100" font-size="34" font-weight="800" fill="url(#t3)" letter-spacing="-0.5">이음 · Eeum</text>
      <text x="32" y="132" font-size="15" font-weight="500" fill="#b6b6c8">빅데이터 분산 기술을 활용한</text>
      <text x="32" y="154" font-size="15" font-weight="500" fill="#b6b6c8">'자립 준비 청년' 사회적 지원 서비스</text>
      <g transform="translate(32,176)" font-size="12.5" font-weight="600" fill="#cdcde0">
        <g><rect width="118" height="28" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="59" y="19" text-anchor="middle">React Native</text></g>
        <g transform="translate(126,0)"><rect width="68" height="28" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="34" y="19" text-anchor="middle">Recoil</text></g>
        <g transform="translate(202,0)"><rect width="116" height="28" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="58" y="19" text-anchor="middle">ElasticSearch</text></g>
      </g>
    </g>

    <!-- ======================= CARD 4 : Rendez-Boo ======================= -->
    <g transform="translate(612,264)">
      <circle cx="70" cy="180" r="120" fill="url(#g4)" filter="url(#b2)"/>
      <rect width="568" height="220" rx="22" fill="url(#cardbg)" stroke="#fff" stroke-opacity="0.10"/>
      <rect x="24" y="0.5" width="520" height="1" fill="url(#sheen2)"/>
      <g transform="translate(420,28)">
