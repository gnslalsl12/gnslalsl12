        <text x="50" y="20" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">3D · AI</text>
      </g>
      <text x="32" y="58" font-size="14" font-weight="700" letter-spacing="2" fill="#7c7c92">02 · 팀 프로젝트 · SSAFY</text>
      <text x="32" y="100" font-size="34" font-weight="800" fill="url(#t2)" letter-spacing="-0.5">WORLDY</text>
      <text x="32" y="132" font-size="15" font-weight="500" fill="#b6b6c8">AI 기술을 활용한 3D 메타버스</text>
