  <rect width="1200" height="508" fill="#0a0a0f"/>

  <!-- ======================= CARD 1 : Famring (LIVE) ======================= -->
  <g font-family="'Segoe UI','Montserrat',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
    <g transform="translate(20,20)">
      <circle cx="500" cy="40" r="120" fill="url(#g1)" filter="url(#b2)"/>
      <rect width="568" height="220" rx="22" fill="url(#cardbg)" stroke="#fff" stroke-opacity="0.10"/>
      <rect x="24" y="0.5" width="520" height="1" fill="url(#sheen2)"/>
      <!-- live badge -->
      <g transform="translate(454,28)">
        <rect width="86" height="30" rx="15" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.45"/>
        <circle cx="22" cy="15" r="4" fill="#34d399"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
        <text x="34" y="20" fill="#6ee7b7" font-size="12" font-weight="700" letter-spacing="1">LIVE</text>
      </g>
      <text x="32" y="58" font-size="14" font-weight="700" letter-spacing="2" fill="#7c7c92">01 · 개인 풀스택 · 운영 중</text>
      <text x="32" y="100" font-size="34" font-weight="800" fill="url(#t1)" letter-spacing="-0.5">Famring</text>
      <text x="32" y="132" font-size="15" font-weight="500" fill="#b6b6c8">가족 단위로 계정·일정·정보를 안전하게</text>
      <text x="32" y="154" font-size="15" font-weight="500" fill="#b6b6c8">공유하는 모바일 PWA 서비스</text>
