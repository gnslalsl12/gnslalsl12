        <text x="60" y="20" fill="#f9a8d4" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">REAL-TIME</text>
      </g>
      <text x="32" y="58" font-size="14" font-weight="700" letter-spacing="2" fill="#7c7c92">04 · 팀 프로젝트 · SSAFY</text>
