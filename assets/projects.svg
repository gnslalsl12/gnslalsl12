        <g><rect width="78" height="28" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="39" y="19" text-anchor="middle">Next.js</text></g>
        <g transform="translate(86,0)"><rect width="58" height="28" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="29" y="19" text-anchor="middle">PWA</text></g>
        <g transform="translate(152,0)"><rect width="92" height="28" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="46" y="19" text-anchor="middle">Supabase</text></g>
        <g transform="translate(252,0)"><rect width="118" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.14" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="59" y="19" text-anchor="middle" fill="#d8caff">AES-256-GCM</text></g>
      </g>
    </g>

    <!-- ======================= CARD 2 : WORLDY ======================= -->
    <g transform="translate(612,20)">
