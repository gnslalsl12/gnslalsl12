      <text x="32" y="132" font-size="15" font-weight="500" fill="#b6b6c8">WebRTC 기술을 활용한</text>
      <text x="32" y="154" font-size="15" font-weight="500" fill="#b6b6c8">블라인드 미팅 플랫폼</text>
      <g transform="translate(32,176)" font-size="12.5" font-weight="600" fill="#cdcde0">
        <g><rect width="62" height="28" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="31" y="19" text-anchor="middle">React</text></g>
        <g transform="translate(70,0)"><rect width="78" height="28" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="39" y="19" text-anchor="middle">WebRTC</text></g>
        <g transform="translate(156,0)"><rect width="106" height="28" rx="14" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/><text x="53" y="19" text-anchor="middle">TensorFlow</text></g>
      </g>
