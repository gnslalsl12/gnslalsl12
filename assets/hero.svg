<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-label="Jeong Hoon - Frontend Developer">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="55%" stop-color="#2563eb"/><stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#f1ecff" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.95"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.36" cy="0.30" r="0.75">
      <stop offset="0%" stop-color="#e9e3ff"/><stop offset="32%" stop-color="#a78bfa"/><stop offset="70%" stop-color="#6366f1"/><stop offset="100%" stop-color="#4338ca"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oV" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="oB" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="oM" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#e879f9" stop-opacity="0.5"/><stop offset="100%" stop-color="#e879f9" stop-opacity="0"/></radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#5b3fae" flood-opacity="0.22"/>
    </filter>
    <filter id="blurz" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="soft8"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="cardClip"><rect x="30" y="34" width="1140" height="292" rx="30"/></clipPath>
  </defs>

  <!-- frosted glass card (transparent canvas → page background shows through margins) -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="34" width="1140" height="292" rx="30" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.5"/>
  </g>
  <!-- vibrant orbs tinting the glass from within -->
  <g clip-path="url(#cardClip)" opacity="0.9">
    <circle cx="150" cy="70" r="150" fill="url(#oV)" filter="url(#blurz)"><animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="330" r="150" fill="url(#oM)" filter="url(#blurz)"><animate attributeName="opacity" values="0.6;0.95;0.6" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="60" r="140" fill="url(#oB)" filter="url(#blurz)"><animate attributeName="opacity" values="0.55;0.9;0.55" dur="11s" repeatCount="indefinite"/></circle>
  </g>
  <!-- inner hairline + top sheen for the glass edge -->
  <rect x="31" y="35" width="1138" height="290" rx="29" fill="none" stroke="#7c3aed" stroke-opacity="0.12"/>
  <rect x="70" y="35" width="1060" height="1.5" fill="url(#sheen)" opacity="0.8"/>

  <!-- ===== text ===== -->
  <g font-family="'Segoe UI','Montserrat',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
    <g transform="translate(92,92)">
      <circle cx="6" cy="-4" r="4" fill="#7c3aed"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="22" y="0" fill="#7c3aed" font-size="15" font-weight="700" letter-spacing="5">SW DEVELOPER · FRONTEND</text>
    </g>
    <text x="90" y="168" font-size="62" font-weight="800" letter-spacing="-1.5">
      <tspan fill="#241f3a">Hi, I&apos;m </tspan><tspan fill="url(#name)">Jeong Hoon</tspan>
    </text>
    <text x="92" y="210" fill="#5b566f" font-size="19" font-weight="500">interactive web, made human — 생동감 있는 웹 경험을 만듭니다.</text>

    <g transform="translate(92,248)" font-size="14" font-weight="600">
      <g><rect x="0" y="0" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.6" stroke="#7c3aed" stroke-opacity="0.18"/><text x="59" y="22" fill="#463f5e" text-anchor="middle">SSAFY 8기</text></g>
      <g transform="translate(130,0)"><rect x="0" y="0" width="152" height="34" rx="17" fill="#ffffff" fill-opacity="0.6" stroke="#7c3aed" stroke-opacity="0.18"/><text x="76" y="22" fill="#463f5e" text-anchor="middle">Frontend Leader</text></g>
      <g transform="translate(294,0)"><rect x="0" y="0" width="232" height="34" rx="17" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-opacity="0.4"/><text x="116" y="22" fill="#6d28d9" text-anchor="middle">하나금융티아이 · AI솔루션셀</text></g>
    </g>
  </g>

  <!-- ===== floating isometric glass cube (gentle bob) ===== -->
  <g transform="translate(980,176)">
    <defs>
      <linearGradient id="cubeTop" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/><stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.55"/></linearGradient>
      <linearGradient id="cubeR" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#60a5fa" stop-opacity="0.52"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0.34"/></linearGradient>
      <linearGradient id="cubeL" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.58"/><stop offset="100%" stop-color="#6d28d9" stop-opacity="0.42"/></linearGradient>
    </defs>
    <ellipse cx="0" cy="108" rx="74" ry="12" fill="#5b3fae" opacity="0.18" filter="url(#soft8)">
      <animate attributeName="rx" values="74;62;74" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.1;0.18" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="5s" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" repeatCount="indefinite"/>
      <!-- vibrant glow behind the glass -->
      <circle r="98" fill="url(#oV)" filter="url(#blurz)" opacity="0.85"/>
      <!-- cube faces (isometric) -->
      <polygon points="-78,-39 0,-78 78,-39 0,0" fill="url(#cubeTop)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="-78,-39 0,0 0,78 -78,39" fill="url(#cubeL)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6" stroke-linejoin="round"/>
      <polygon points="78,-39 0,0 0,78 78,39" fill="url(#cubeR)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6" stroke-linejoin="round"/>
      <!-- top specular + sparkle -->
      <ellipse cx="-16" cy="-48" rx="24" ry="12" fill="#ffffff" opacity="0.5" filter="url(#soft8)"/>
      <path d="M0 -54 C1.2 -45 2.6 -43.6 11 -42 C2.6 -40.4 1.2 -39 0 -30 C-1.2 -39 -2.6 -40.4 -11 -42 C-2.6 -43.6 -1.2 -45 0 -54 Z" fill="#ffffff" opacity="0.92"/>
      <!-- right face: JH painted onto the plane -->
      <g transform="matrix(0.894,-0.447,0,1,39,20)"><text x="0" y="9" font-family="'Segoe UI','Montserrat',sans-serif" font-size="30" font-weight="800" fill="#ffffff" fill-opacity="0.94" text-anchor="middle">JH</text></g>
      <!-- left face: code lines painted onto the plane -->
      <g transform="matrix(-0.894,-0.447,0,1,-39,24)" fill="#ffffff" fill-opacity="0.6">
        <rect x="-22" y="-12" width="44" height="5" rx="2.5"/>
        <rect x="-22" y="-1" width="30" height="5" rx="2.5"/>
        <rect x="-22" y="10" width="38" height="5" rx="2.5"/>
      </g>
      <!-- slow orbiting sparkle -->
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
        <circle cx="0" cy="-106" r="4" fill="#c026d3"><animate attributeName="r" values="3;5;3" dur="2.6s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>
</svg>
