<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-label="Jeong Hoon - Frontend Developer">
  <defs>
    <!-- palette mirrors the portfolio: violet -> blue -> magenta -->
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="coinFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="coinEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.28" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <!-- backdrop -->
  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="#0a0a0f"/>

    <!-- ambient mesh orbs -->
    <circle cx="120" cy="40" r="200" fill="url(#orbV)" filter="url(#soft)" opacity="0.7">
      <animate attributeName="opacity" values="0.45;0.8;0.45" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="320" r="220" fill="url(#orbB)" filter="url(#soft)" opacity="0.6">
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="380" r="200" fill="url(#orbM)" filter="url(#soft)" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- grain overlay -->
    <rect width="1200" height="360" filter="url(#grain)" opacity="0.05"/>

    <!-- glass panel -->
    <rect x="40" y="40" width="1120" height="280" rx="26" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="64" y="40.5" width="1072" height="1" fill="url(#sheen)"/>

    <!-- ===== text block ===== -->
    <g font-family="'Segoe UI','Montserrat',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
      <!-- eyebrow -->
      <g transform="translate(96,96)">
        <circle cx="6" cy="-4" r="4" fill="#8b5cf6">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="22" y="0" fill="#8b5cf6" font-size="15" font-weight="600" letter-spacing="5">SW DEVELOPER · FRONTEND</text>
      </g>

      <!-- headline -->
      <text x="94" y="170" font-size="64" font-weight="800" letter-spacing="-1.5">
        <tspan fill="#ececf1">Hi, I&apos;m </tspan><tspan fill="url(#name)">Jeong Hoon</tspan>
      </text>

      <!-- subline -->
      <text x="96" y="212" fill="#9a9ab0" font-size="19" font-weight="500">interactive web, made human — 생동감 있는 웹 경험을 만듭니다.</text>

      <!-- chips -->
      <g transform="translate(96,250)" font-size="14" font-weight="600">
        <g>
          <rect x="0" y="0" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
          <text x="59" y="22" fill="#cdcde0" text-anchor="middle">SSAFY 8기</text>
        </g>
        <g transform="translate(130,0)">
          <rect x="0" y="0" width="152" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
          <text x="76" y="22" fill="#cdcde0" text-anchor="middle">Frontend Leader</text>
        </g>
        <g transform="translate(294,0)">
          <rect x="0" y="0" width="232" height="34" rx="17" fill="#8b5cf6" fill-opacity="0.14" stroke="#8b5cf6" stroke-opacity="0.40"/>
          <text x="116" y="22" fill="#d8caff" text-anchor="middle">하나금융티아이 · AI솔루션셀</text>
        </g>
      </g>
    </g>

    <!-- ===== 3D flipping coin ===== -->
    <g transform="translate(980,180)" font-family="'Segoe UI','Montserrat',system-ui,sans-serif">
      <!-- soft ground shadow -->
      <ellipse cx="0" cy="120" rx="92" ry="14" fill="#000000" opacity="0.45" filter="url(#soft)"/>

      <!-- the coin flips by squashing its X scale (edge-on illusion) -->
      <g>
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="1 1; 0.04 1; 1 1; 0.04 1; 1 1" keyTimes="0;0.25;0.5;0.75;1"
          dur="6s" calcMode="spline"
          keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"
          repeatCount="indefinite"/>

        <!-- metallic edge / thickness, visible most when squashed -->
        <rect x="-96" y="-96" width="192" height="192" rx="96" fill="url(#coinEdge)"/>

        <!-- FRONT face : JH -->
        <g>
          <animate attributeName="opacity" values="1;0;1;0;1" keyTimes="0;0.25;0.5;0.75;1"
            dur="6s" calcMode="discrete" repeatCount="indefinite"/>
          <circle r="90" fill="url(#coinFace)"/>
          <circle r="90" fill="url(#gloss)"/>
          <circle r="78" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
          <text x="0" y="22" fill="#ffffff" font-size="64" font-weight="800" text-anchor="middle" letter-spacing="-2">JH</text>
          <text x="0" y="56" fill="#ffffff" fill-opacity="0.7" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="3">DEVELOPER</text>
        </g>

        <!-- BACK face : </> -->
        <g opacity="0">
          <animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.25;0.5;0.75;1"
            dur="6s" calcMode="discrete" repeatCount="indefinite"/>
          <circle r="90" fill="url(#coinFace)"/>
          <circle r="90" fill="url(#gloss)"/>
          <circle r="78" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
          <text x="0" y="26" fill="#ffffff" font-size="60" font-weight="800" text-anchor="middle">&lt;/&gt;</text>
        </g>
      </g>

      <!-- orbiting spark -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
        <circle cx="0" cy="-112" r="4.5" fill="#d946ef">
          <animate attributeName="r" values="3;5.5;3" dur="2.6s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
</svg>
